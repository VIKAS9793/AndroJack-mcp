name: Bug Report
description: File a report to help us improve AndroJack-mcp
title: "[BUG] <Short description of the bug>"
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🤖
  - type: input
    id: version
    attributes:
      label: AndroJack version
      description: Output of `npx androjack-mcp --version`
      placeholder: e.g., 2.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: MCP client / IDE, transport (stdio or HTTP), and Node.js version
      placeholder: e.g., Cursor 1.4, stdio, Node 22.11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      description: How can we reproduce the issue?
      placeholder: |
        1. Ask the AI to build X
        2. Tool call Y fails with error Z
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots or paste terminal logs.
