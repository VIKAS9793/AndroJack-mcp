name: Main Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Print dependency tree
        run: npm ls hono @modelcontextprotocol/sdk @hono/node-server

      - name: Assert secure Hono resolution (floor >= 4.12.7)
        shell: bash
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process');

          const tree = JSON.parse(execSync('npm ls hono --json', { encoding: 'utf8' }));
          const versions = new Set();

          function walk(name, node) {
            if (!node || typeof node !== 'object') return;
            if (name === 'hono' && node.version) versions.add(node.version);
            const deps = node.dependencies || {};
            for (const [depName, depNode] of Object.entries(deps)) {
              walk(depName, depNode);
            }
          }

          walk(tree.name || 'root', tree);

          if (versions.size === 0) {
            throw new Error('Resolved dependency tree does not contain hono');
          }

          for (const v of versions) {
            const parts = v.split('.').map(Number);
            const [maj, min, pat] = parts;
            if (maj < 4 || (maj === 4 && min < 12) || (maj === 4 && min === 12 && pat < 7)) {
              console.error(`Hono version ${v} is below floor 4.12.7`);
              process.exit(1);
            }
          }
          console.log('Hono floor OK:', [...versions].join(', '));
          NODE

      - name: Assert SDK floor >= 1.32.1
        shell: bash
        run: |
          node << 'NODE'
          const { execSync } = require('node:child_process');
          const tree = JSON.parse(execSync('npm ls @modelcontextprotocol/sdk --json', { encoding: 'utf8' }));
          const versions = new Set();
          function walk(name, node) {
            if (!node || typeof node !== 'object') return;
            if (name === '@modelcontextprotocol/sdk' && node.version) versions.add(node.version);
            for (const [k, v] of Object.entries(node.dependencies || {})) walk(k, v);
          }
          walk(tree.name || 'root', tree);
          if (versions.size === 0) throw new Error('SDK not found in dependency tree');
          for (const v of versions) {
            const [maj, min, pat] = v.split('.').map(Number);
            if (maj < 1 || (maj === 1 && min < 32) || (maj === 1 && min === 32 && pat < 1)) {
              console.error(`SDK version ${v} is below floor 1.32.1 (<=1.30.1 has a high-severity advisory)`);
              process.exit(1);
            }
          }
          console.log('SDK floor OK:', [...versions].join(', '));
          NODE

      - name: Assert no .connector-build artifacts tracked
        shell: bash
        run: |
          tracked=$(git ls-files .connector-build)
          if [ -n "$tracked" ]; then
            echo "ERROR: .connector-build artifacts are still tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo ".connector-build hygiene OK"

      - name: Unit, regression, and UAT suites
        run: |
          echo "Verifying test files..."
          ls -l test/*.test.mjs test/uat/*.test.mjs test/uat/UAT_PLAN.md
          npm test

      - name: Dogfood the CI gate (validate CLI emits valid SARIF)
        run: |
          node build/index.js validate test --format=sarif --fail-on=never > "$RUNNER_TEMP/androjack.sarif"
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if (s.version!=="2.1.0") process.exit(1); console.log("SARIF OK, rules:", s.runs[0].tool.driver.rules.length)' "$RUNNER_TEMP/androjack.sarif"
